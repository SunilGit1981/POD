<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form id="login-form">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username"><br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password"><br><br>
            <button type="submit">Login</button>
        </form>
        <button id="gmail-auth-button">Sign in with Gmail</button>
        <div id="gmail-auth-container"></div>
        <script src="https://accounts.google.com/gsi/client" async defer></script>
        <script>
            const gmailAuthButton = document.getElementById('gmail-auth-button');
            const clientId = 'YOUR_CLIENT_ID';
            gmailAuthButton.onclick = async () => {
                try {
                    const response = await fetch('https://accounts.google.com/o/oauth2/v2/auth', {
                        method: 'GET',
                        params: {
                            client_id: clientId,
                            redirect_uri: 'http://localhost:3000',
                            response_type: 'token',
                            scope: 'https://www.googleapis.com/auth/userinfo.email'
                        }
                    });
                    const token = await response.json();
                    const userData = await fetch('https://openidconnect.googleapis.com/v1/userinfo', {
                        method: 'GET',
                        headers: {
                            Authorization: `Bearer ${token.access_token}`
                        }
                    });
                    const userInfo = await userData.json();
                    console.log(userInfo);
                    document.getElementById('gmail-auth-container').innerHTML = `Welcome, ${userInfo.name}!`;
                } catch (error) {
                    console.error(error);
                }
            };
        </script>
    </div>
</body>
</html>
