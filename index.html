<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Dark Theme</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2f2f2f;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #4f4f4f;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        footer {
            background-color: #4f4f4f;
            color: #ffffff;
            padding: 10px;
            text-align: center;
            clear: both;
            position: relative;
            bottom: 0;
            width: 100%;
        }
        @media only screen and (max-width: 768px) {
            main {
                padding: 10px;
            }
        }
        .login-form {
            background-color: #4f4f4f;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
        .login-form input {
            width: 100%;
            height: 40px;
            margin-bottom: 20px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #2f2f2f;
            color: #ffffff;
        }
        .login-form button {
            width: 100%;
            height: 40px;
            background-color: #4f4f4f;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .login-form button:hover {
            background-color: #5f5f5f;
        }
    </style>
</head>
<body>
    <header>
        <h1>Responsive Dark Theme</h1>
    </header>
    <main>
        <div class="login-form">
            <input type="text" id="user-id" placeholder="User ID">
            <input type="password" id="password" placeholder="Password">
            <button type="button">Login</button>
        </div>
        <p>This is a responsive dark theme website.</p>
    </main>
    <footer>
        <p>&#169; 2024 Responsive Dark Theme. All rights reserved.</p>
    </footer>
</body>
</html>
