<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Dark Theme</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2f2f2f;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #4f4f4f;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        footer {
            background-color: #4f4f4f;
            color: #ffffff;
            padding: 10px;
            text-align: center;
            clear: both;
            position: relative;
            bottom: 0;
            width: 100%;
        }
        @media only screen and (max-width: 768px) {
            main {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Responsive Dark Theme</h1>
    </header>
    <main>
        <p>This is a responsive dark theme website.</p>
    </main>
    <footer>
        <p>&#169; 2024 Responsive Dark Theme. All rights reserved.</p>
    </footer>
</body>
</html>
