<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Theme</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            color: #333333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #87ceeb;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        footer {
            background-color: #87ceeb;
            color: #ffffff;
            padding: 10px;
            text-align: center;
            clear: both;
            position: relative;
            bottom: 0;
            width: 100%;
        }
        @media only screen and (max-width: 768px) {
            main {
                padding: 10px;
            }
        }
        .login-form {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            width: 300px;
        }
        .login-form input {
            width: 100%;
            height: 40px;
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            background-color: #ffffff;
            color: #333333;
        }
        .login-form button {
            width: 100%;
            height: 40px;
            background-color: #4caf50;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .login-form button:hover {
            background-color: #3e8e41;
        }
        .gmail-btn {
            width: 100%;
            height: 40px;
            background-color: #dd4b39;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .gmail-btn:hover {
            background-color: #c23321;
        }
        .landing-page {
            display: none;
        }
        .landing-page-container {
            display: flex;
        }
        .left-nav {
            background-color: #87ceeb;
            color: #ffffff;
            padding: 20px;
            width: 200px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        .left-nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .left-nav li {
            margin-bottom: 20px;
        }
        .left-nav a {
            color: #ffffff;
            text-decoration: none;
        }
        .left-nav a:hover {
            color: #cccccc;
        }
        .main-content {
            margin-left: 200px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Responsive Theme</h1>
    </header>
    <main id="login-page">
        <div class="login-form">
            <input type="text" id="user-id" placeholder="User ID">
            <input type="password" id="password" placeholder="Password">
            <button type="button" id="login-btn">Login</button>
            <button class="gmail-btn" id="gmail-signin-btn">Sign in with Gmail</button>
        </div>
        <p style="margin-top: 20px;">This is a responsive website.</p>
        <div id="gmail-signin-status" style="margin-top: 10px;"></div>
    </main>
    <main class="landing-page" id="landing-page">
        <div class="landing-page-container">
            <div class="left-nav">
                <ul>
                    <li><a href="#" id="dashboard-link">Dashboard</a></li>
                    <li><a href="#" id="sales-lead-link">Sales Lead</a></li>
                    <li><a href="#" id="logout-link">Logout</a></li>
                </ul>
            </div>
            <div class="main-content">
                <h1>Welcome to the landing page</h1>
                <p>This is the main content area.</p>
            </div>
        </div>
    </main>
    <footer>
        <p>&#169; 2024 Responsive Theme. All rights reserved.</p>
    </footer>
    <script>
        function handleGmailAuthentication() {
            window.location.href = 'https://accounts.google.com/o/oauth2/auth?scope=https://www.googleapis.com/auth/gmail.send&response_type=code&redirect_uri=http://localhost:8080&client_id=YOUR_CLIENT_ID';
        }

        window.onload = function () {
            document.getElementById('gmail-signin-btn').addEventListener('click', function(){
                handleGmailAuthentication();
            });

            document.getElementById('login-btn').addEventListener('click', function(){
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('landing-page').style.display = 'block';
            });

            document.getElementById('logout-link').addEventListener('click', function(){
                document.getElementById('login-page').style.display = 'block';
                document.getElementById('landing-page').style.display = 'none';
            });
        }
    </script>
</body>
</html>
